name: workshop-checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python scripts/check_student_repo.py
      - run: uv run pytest -m "not live"
      - run: uv run carrito eval --split dev --mode fixture
      - run: uv run python scripts/check_notebooks.py
      - run: uv run carrito mcp-smoke
      - run: uv run python examples/learning_labs.py

  optional-langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra langchain
      - run: uv run --extra langchain pytest -m "not live"
      - run: uv run --extra langchain python examples/langchain_comparison.py --mode fixture
